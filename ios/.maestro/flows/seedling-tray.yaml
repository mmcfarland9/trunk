appId: mpmcf.Trunk
name: Seedling Tray - Branch-Grouped Tray and Plant Flow
---

# Ensure authenticated
- launchApp:
    clearState: false

- runFlow: helpers/ensure-logged-in.yaml

# Wait for app to load
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000

# --- Step 1: Navigate to a twig and create a seedling idea ---
# NOTE: TwigNode buttons in BranchView use .position() inside a TimelineView
# (wind animation). Maestro's isScreenStatic check times out against animated
# views; element-based taps take ~13s waiting for settle and do not trigger the
# Button action. This step is the known blocked point on this device/setup.
# The twig accessibility ID is "twig-movement"; the seedling input placeholder
# is "Add a seedling idea...". When the BranchView tap issue is resolved (e.g.
# by adding .contentShape(Rectangle()) to TwigNode, or via Maestro update),
# this block will work unmodified.

- tapOn: "Trunk"
- extendedWaitUntil:
    visible:
      id: "branch-CORE"
    timeout: 8000
- tapOn:
    id: "branch-CORE"
- extendedWaitUntil:
    visible:
      id: "twig-movement"
    timeout: 8000
- tapOn:
    id: "twig-movement"
    index: 0
- extendedWaitUntil:
    visible: "Add a seedling idea..."
    timeout: 10000
- tapOn: "Add a seedling idea..."
- inputText: "Maestro idea"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Maestro idea"
    timeout: 8000
- tapOn: "Done"

# --- Step 2: Navigate to Garden → Seedlings tray ---

- tapOn: "Garden"
- extendedWaitUntil:
    visible: "GARDEN"
    timeout: 8000
- tapOn: "Seedlings"
- extendedWaitUntil:
    visible: "Maestro idea"
    timeout: 8000

# --- Step 3: Assert branch-grouped tray structure ---
# Branch header shows: "<BranchName>  (N)"
- assertVisible:
    text: "(1)"
- assertVisible: "Maestro idea"

# --- Step 4: Tap "Set" to open the plant form ---

- tapOn: "Set"
- extendedWaitUntil:
    visible: "PLANT"
    timeout: 8000
- assertVisible: "PLANT"
