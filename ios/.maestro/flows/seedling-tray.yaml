appId: mpmcf.Trunk
name: Seedling Tray - Branch-Grouped Tray and Plant Flow
---

# Ensure authenticated
- launchApp:
    clearState: false

- runFlow: helpers/ensure-logged-in.yaml

# Wait for app to load
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000

# --- Step 1: Navigate to a twig and create a seedling idea ---
# Twig nodes use .contentShape(Rectangle()) + .onTapGesture (matching the
# working branch nodes), so taps land reliably on the wind-animated screen.

- tapOn: "Trunk"
- extendedWaitUntil:
    visible:
      id: "branch-CORE"
    timeout: 8000
- tapOn:
    id: "branch-CORE"
- extendedWaitUntil:
    visible:
      id: "twig-movement"
    timeout: 8000
- tapOn:
    id: "twig-movement"
    index: 0
- extendedWaitUntil:
    visible: "Add a seedling idea..."
    timeout: 10000
- tapOn: "Add a seedling idea..."
- inputText: "Maestro idea"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Maestro idea"
    timeout: 8000
- tapOn: "Done"

# --- Step 2: Navigate to Garden → Seedlings tray ---

- tapOn: "Garden"
- extendedWaitUntil:
    visible: "GARDEN"
    timeout: 8000
- tapOn: "Seedlings"
- extendedWaitUntil:
    visible: "Maestro idea"
    timeout: 8000

# --- Step 3: Assert branch-grouped tray structure ---
# The seedling appears under its branch header (CORE). Count-agnostic so it
# survives re-runs (clearState:false leaves prior "Maestro idea" seedlings).
- assertVisible: "CORE"
- assertVisible: "Maestro idea"

# --- Step 4: Tap "Set" → the plant form opens, pre-filled with the seedling ---
# (The "PLANT" button is at the bottom of a long scrollable form; assert the
# form title + the pre-filled title instead — both visible without scrolling.)

- tapOn: "Set"
- extendedWaitUntil:
    visible: "NEW SPROUT"
    timeout: 8000
- assertVisible: "Maestro idea"
